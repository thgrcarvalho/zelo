version: 2
updates:
  # Gradle dependencies across the multi-module build (the root build resolves all).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Batch Spring Boot bumps together so they're reviewed/tested as a set.
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management*"
    ignore:
      # Boot 4 / Framework 7 is a deliberate migration project, not a routine
      # bump — and springdoc 3.x is built against Boot 4 (2.8.x is the line
      # that matches Boot 3.4/3.5). Majors stay out until that migration;
      # minor/patch updates on the current lines keep flowing.
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.spring.dependency-management*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  # Keep the CI actions (checkout, setup-java, setup-gradle) patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
